services:
  - type: web
    name: popblitz-game-server
    runtime: node
    rootDir: server
    plan: free
    region: virginia
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false

